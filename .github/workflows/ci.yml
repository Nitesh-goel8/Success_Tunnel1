name: CI on Push

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: successtunnel_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: successtunnel_app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/successtunnel_test?schema=public"

      - name: Build Next.js Production App
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci_jwt_super_secret_for_build_testing_2026"
          NEXT_PUBLIC_APP_URL: "https://successtunnel.in"

      - name: Verify ERP Test Suite
        run: npm test
        continue-on-error: true
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci_jwt_super_secret_for_build_testing_2026"
